name: Build Freedom VPN APK
# Signing: secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD (alias freedomvpn).

# Run manually (Actions -> Build Freedom VPN APK -> Run workflow) or push a tag like v1.0.1.
# A tag build, or a manual run with "release" set (e.g. 1.0.1), publishes a GitHub Release
# (tag v<version>), which the app uses for update checks. Empty "release" = test build only.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version without "v" (e.g. 1.0.1). Empty = test build'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Check signing secrets
      run: |
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
          echo "::error::Add secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD (Settings -> Secrets and variables -> Actions)"
          exit 1
        fi

    - name: Version from tag
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "RELEASE_TAG=$GITHUB_REF_NAME" >> $GITHUB_ENV
        elif [[ -n "${{ inputs.release }}" ]]; then
          echo "APP_VERSION_NAME=${{ inputs.release }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${{ inputs.release }}" >> $GITHUB_ENV
        else
          echo "APP_VERSION_NAME=0.0.${{ github.run_number }}-test" >> $GITHUB_ENV
        fi
        echo "APP_VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> $GITHUB_ENV

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray (Xray core)
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    # The panel templates (Auto, White lists) use RoscomVPN codes such as geoip:direct and
    # geosite:whitelist, so the app ships the same geo files that Happ gets from the routing header.
    - name: Download RoscomVPN geo files
      run: |
        ASSETS=V2rayNG/app/src/main/assets
        curl -fsSL -o $ASSETS/geosite.dat https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat
        curl -fsSL -o $ASSETS/geoip.dat https://github.com/hydraponique/roscomvpn-geoip/releases/latest/download/geoip.dat
        ls -l $ASSETS/*.dat

    - name: Setup Java
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/freedomvpn.jks

    - name: Unit tests (Freedom VPN code)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest \
          --tests 'com.v2ray.ang.freedom.*' \
          --tests 'com.v2ray.ang.ui.main.ServerNameSplitTest' \
          --tests 'com.v2ray.ang.ui.main.ExpiryDateFormatTest' \
          --tests 'com.v2ray.ang.ui.main.MainSubscriptionInfoTest' \
          --tests 'com.v2ray.ang.ui.userasset.UserAssetViewModelTest'

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ runner.temp }}/freedomvpn.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=freedomvpn \
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}
        mkdir -p ${{ github.workspace }}/out
        cp app/build/outputs/apk/playstore/release/*.apk ${{ github.workspace }}/out/
        # stable name for the download link: .../releases/latest/download/FreedomVPN.apk
        cp app/build/outputs/apk/playstore/release/*universal*.apk ${{ github.workspace }}/out/FreedomVPN.apk
        ls -l ${{ github.workspace }}/out

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      with:
        name: FreedomVPN-apk
        path: ${{ github.workspace }}/out/*.apk

    - name: Publish GitHub Release
      if: env.RELEASE_TAG != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Freedom VPN ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        files: |
          ${{ github.workspace }}/out/FreedomVPN.apk
          ${{ github.workspace }}/out/*arm64-v8a*.apk
          ${{ github.workspace }}/out/*armeabi-v7a*.apk
          ${{ github.workspace }}/out/*universal*.apk
